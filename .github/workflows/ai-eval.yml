# Nightly AI eval (roadmap §5.5): the eval set against a live model, compared
# with the last good run. A scenario that used to pass and now fails — or any
# failure of a critical one — fails this job, and GitHub mails the failure.
#
# Needs a repository secret AI_EVAL_API_KEY (a Metis key). Without it the
# "AI eval" job is SKIPPED, not green: the "Eval key" job decides first and
# leaves a notice saying why (review 2026-11-28 — before, every step was skipped
# inside the job and the run showed a passing eval that never ran). Optional
# repository variables: AI_EVAL_MODEL (default gpt-4.1-mini, the production chat
# model) and AI_EVAL_REPEAT (default 3). Each night runs every scenario in
# app/services/ai_eval/scenarios.json (49 on 2026-11-28) × REPEAT, so the cost
# grows with that file.
name: AI eval

on:
  schedule:
    - cron: "23 1 * * *"          # 01:23 UTC, nightly
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate (default: AI_EVAL_MODEL or gpt-4.1-mini)"
        required: false
      repeat:
        description: "Runs per scenario"
        required: false
        default: "3"
      accept:
        description: "Keep this run as the new baseline even if it regressed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-eval
  cancel-in-progress: false

jobs:
  # Secrets can't be read in a job's `if:`, so this small job reads it and the
  # eval job runs only when it said yes.
  key:
    name: Eval key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.key.outputs.run }}
    steps:
      - name: Is AI_EVAL_API_KEY set?
        id: key
        env:
          KEY: ${{ secrets.AI_EVAL_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice title=AI eval not run::AI_EVAL_API_KEY is not set, so the eval job is skipped. Add it under Settings → Secrets and variables → Actions to run the nightly eval."
            echo "**AI eval not run:** the repository secret \`AI_EVAL_API_KEY\` is not set." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  eval:
    name: AI eval
    needs: key
    if: needs.key.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aa_eval_scratch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aa_eval_scratch
      AUTH_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      APP_ENV: test
      SCHEDULER_ENABLED: "false"
      AI_PROVIDER: metis
      METIS_API_KEY: ${{ secrets.AI_EVAL_API_KEY }}
      METIS_MODEL: ${{ inputs.model || vars.AI_EVAL_MODEL || 'gpt-4.1-mini' }}
      REPEAT: ${{ inputs.repeat || vars.AI_EVAL_REPEAT || '3' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libffi-dev fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Bootstrap the scratch database
        run: python -m app.prestart

      # The last good run's report (saved below); the newest cache wins.
      - name: Restore the previous report
        uses: actions/cache/restore@v4
        with:
          path: ai-eval-baseline
          key: ai-eval-report-${{ github.run_id }}
          restore-keys: ai-eval-report-

      - name: Run the eval
        run: |
          mkdir -p ai-eval-baseline ai-eval-out
          python -m scripts.ai_eval run --repeat "$REPEAT" \
            --previous ai-eval-baseline/report.json --out ai-eval-out/report.json \
            --summary "$GITHUB_STEP_SUMMARY" --fail-on-regression

      - name: Keep the report for the next run
        if: success() || inputs.accept
        run: cp ai-eval-out/report.json ai-eval-baseline/report.json

      - name: Save it as the new baseline
        if: success() || inputs.accept
        uses: actions/cache/save@v4
        with:
          path: ai-eval-baseline
          key: ai-eval-report-${{ github.run_id }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: ai-eval-out/report.json
          if-no-files-found: ignore
          retention-days: 30
