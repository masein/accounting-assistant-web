# The Android app (android/): unit tests (the client against a mock server,
# block parsing, number formatting), screenshot tests rendered with
# Robolectric and Roborazzi (no emulator), the contract test against the
# server's recorded replies, and a debug build. Runs when the app, the
# contract (docs/contracts) or this workflow changes.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "docs/contracts/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "docs/contracts/**", ".github/workflows/android.yml"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit and screenshot tests
        # every unit test on the build outside Play (it has everything Play's has, and the SMS
        # reading), with the screenshot tests writing their images; then Play's own build test:
        # no SMS permission, no receiver (roadmap §7.1, §11.5)
        run: ./gradlew --no-daemon :app:recordRoborazziDirectDebug :app:testPlayDebugUnitTest --tests '*StoreBuildTest*'
      - name: Debug builds
        run: ./gradlew --no-daemon :app:assembleDirectDebug :app:assemblePlayDebug
      - name: Lint
        # errors fail the build: it caught the app lock throwing on a locked phone (USE_BIOMETRIC) and an
        # Android 10 call reached on Android 9, which the emulator and the tests never did
        run: ./gradlew --no-daemon :app:lintDirectDebug :app:lintPlayDebug
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: android/app/build/outputs/roborazzi
          if-no-files-found: ignore
