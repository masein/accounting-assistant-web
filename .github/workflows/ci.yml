name: CI

# Runs the test suite on every pull request into main and on pushes to main,
# so a PR can't be merged green unless the tests pass. Tests use an in-process
# SQLite database (see tests/conftest.py), so no external services are needed.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 \
            libffi-dev fonts-dejavu-core fonts-noto-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (coverage gate — fails below the threshold in pyproject.toml)
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80

  lint:
    name: Lint (ruff) — informational
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install ruff

      # --exit-zero: surface lint issues as GitHub annotations without ever
      # failing the check, so pre-existing lint debt never blocks a merge or
      # shows a red X. The pytest job above is the real gate.
      - name: Ruff check (non-gating)
        run: ruff check --output-format=github --exit-zero .

  # The suite above runs on SQLite; production is PostgreSQL. This job
  # bootstraps an empty PostgreSQL exactly like the container entrypoint and
  # checks the schema ends at head, that both a fresh and a migrated install
  # match the models exactly (alembic check), and runs the whole suite against
  # PostgreSQL — all gating (roadmap 2026-09 §1.12 / M8, §1.13 drift).
  postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/accounting
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/accounting_test
      AUTH_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      APP_ENV: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 \
            libffi-dev fonts-dejavu-core fonts-noto-core postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The migration chain assumes the tables exist (the very first migrations
      # patch a create_all schema), so an empty database is bootstrapped exactly
      # the way the container entrypoint does it: create_all → stamp/upgrade →
      # seed. Any migration that no longer applies fails here, before deploy.
      - name: Bootstrap an empty database like the container (create_all → migrate → seed)
        env:
          APP_DB_PASSWORD: ci-only-app-role-password-0123456789
        run: |
          python -m app.prestart
          alembic current | tee current.txt
          grep -q "(head)" current.txt

      # Pre-start created the restricted role the web server can run as
      # (app/db/roles.py, DEPLOY.md §11): rows yes, schema and audit edits no.
      - name: Restricted app role can write rows but not touch the audit log
        env:
          PGPASSWORD: ci-only-app-role-password-0123456789
        run: |
          psql -h localhost -U aa_app -d accounting -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM audit_logs" -c "INSERT INTO rate_limit_events (id, bucket, identity, at) VALUES (gen_random_uuid(), 'ci', 'ci', now())"
          for sql in "UPDATE audit_logs SET action = action" "DELETE FROM audit_logs" "TRUNCATE audit_logs" "ALTER TABLE audit_logs DISABLE TRIGGER ALL" "DROP TABLE companies" "CREATE TABLE pwned (id int)"; do
            if psql -h localhost -U aa_app -d accounting -v ON_ERROR_STOP=1 -c "$sql" 2>err.txt; then echo "ALLOWED: $sql"; exit 1; fi
            grep -qiE "permission denied|must be owner" err.txt || { cat err.txt; exit 1; }
            echo "refused as expected: $sql"
          done

      # A fresh database is stamped, not migrated, so guards that only a
      # migration created were missing on new installs (app/db/guards.py).
      - name: Fresh install has the database guards
        run: |
          python -c "import os, sqlalchemy as sa; c = sa.create_engine(os.environ['DATABASE_URL']).connect(); q = lambda s: c.execute(sa.text(s)).first(); assert q(\"SELECT 1 FROM pg_trigger WHERE tgname = 'trg_audit_logs_append_only'\"), 'append-only trigger missing'; assert q(\"SELECT 1 FROM pg_constraint WHERE conname = 'fk_audit_logs_company'\"), 'audit FK missing'; print('database guards present')"

      # A model change without its migration (or the reverse) fails here.
      # Tenant company_id NOT NULL / FKs are owned by app/db/guards.py and
      # left out of the comparison by alembic/env.py.
      - name: Fresh install matches the models (alembic check)
        run: alembic check

      # The other kind of install: a database built up through the migration
      # chain, like production. The fixture is such a schema at 044; upgrading
      # it must land on exactly the same schema as a fresh install.
      - name: Migrated install converges on the models (044 snapshot → head → alembic check)
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/accounting_migrated
        run: |
          createdb -h localhost -U postgres accounting_migrated
          psql -q -h localhost -U postgres -d accounting_migrated -v ON_ERROR_STOP=1 -f tests/fixtures/schema_044_migrated.sql
          alembic upgrade head
          alembic check

      - name: Run the suite against PostgreSQL
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres accounting_test
          pytest -q -x --maxfail=25 -p no:cacheprovider

  # Browser smoke suite (roadmap 2026-09 §6): a real server on PostgreSQL, a
  # CI-only owner, and Chromium clicking through every page in English and
  # Persian. Fails on any JavaScript exception or any 5xx a page triggers —
  # the five front-end scripts no unit test reads are covered here.
  e2e:
    name: Browser smoke (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounting
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/accounting
      AUTH_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      APP_ENV: test
      SCHEDULER_ENABLED: "false"
      # The browser suite runs the server as the restricted role, so any code
      # path that needs more than row access fails here, not in production.
      APP_DB_PASSWORD: ci-only-app-role-password-0123456789
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_USERNAME: e2e_owner
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 \
            libffi-dev fonts-dejavu-core fonts-noto-core

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Bootstrap the database and the CI-only owner
        run: |
          echo "E2E_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"
          python -m app.prestart

      - name: Seed the e2e user and start the server
        run: |
          python -m tests_e2e.seed_user
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health

      - name: Run the browser smoke suite
        run: python -m pytest -q -p no:cacheprovider -o asyncio_mode=strict tests_e2e -rs

      - name: Keep screenshots and the server log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e-artifacts/
            server.log
          if-no-files-found: ignore
