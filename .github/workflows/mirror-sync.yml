name: Mirror sync

# The server's deployer (scripts/deploy.sh, DEPLOY.md §5) takes each new API image from GHCR, or from the mirror
# when GHCR doesn't answer. The publish job copies each new image to the mirror, but only tries for a minute: from
# 2026-11-14 the mirror answered 502 for days, every publish skipped it, and the mirror fell behind with nothing
# saying so. Every hour this job checks whether the mirror's `latest` is GHCR's `latest` and copies it over when it
# isn't — so once the mirror is back, a server that deploys from it gets the newest image within the hour, with no
# one re-running anything.
#
# The mirror's host is the repository variable MIRROR_REGISTRY (e.g. registry.example.com); while it is unset this
# job is skipped. Turn it off with MIRROR_ENABLED = "false" (as for the publish job's mirror step).

on:
  schedule:
    - cron: "17 * * * *"        # hourly, off the hour
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: mirror-sync
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/accounting-assistant-api
  MIRROR_REGISTRY: ${{ vars.MIRROR_REGISTRY }}
  MIRROR_IMAGE: ${{ vars.IMAGE_NAME || format('{0}/accounting-assistant-api', vars.MIRROR_REGISTRY) }}

jobs:
  sync:
    name: Copy GHCR latest to the mirror when it is behind
    if: ${{ vars.MIRROR_ENABLED != 'false' && vars.MIRROR_REGISTRY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the mirror registry (if credentials are set)
        continue-on-error: true
        env:
          REG_USER: ${{ secrets.REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -n "$REG_USER" ]; then
            echo "$REG_PASS" | docker login "$MIRROR_REGISTRY" -u "$REG_USER" --password-stdin \
              || echo "::warning::mirror login to $MIRROR_REGISTRY failed"
          fi

      - name: Copy latest when the mirror is behind
        run: |
          set -u
          want=$(docker buildx imagetools inspect "$GHCR_IMAGE:latest" --format '{{json .Manifest.Digest}}' | tr -d '"')
          have=$(docker buildx imagetools inspect "$MIRROR_IMAGE:latest" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"' || true)
          if [ -n "$want" ] && [ "$want" = "$have" ]; then
            echo "The mirror is current: $want"; exit 0
          fi
          echo "The mirror has ${have:-nothing it can show}; GHCR latest is $want — copying."
          for attempt in 1 2 3; do
            if docker buildx imagetools create --tag "$MIRROR_IMAGE:latest" "$GHCR_IMAGE@$want"; then
              echo "✓ mirrored $want on attempt $attempt"
              echo "Mirrored \`$want\` to $MIRROR_IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "mirror attempt $attempt failed; retrying in 20s…"; sleep 20
          done
          echo "::warning::the mirror is still unavailable; the next hourly run tries again"
