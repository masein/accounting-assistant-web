name: Publish image

# Builds the API Docker image and publishes it so a server can pull + deploy it.
#
# Primary registry: GitHub Container Registry (ghcr.io) — reliable, needs no
# extra secrets (uses the built-in GITHUB_TOKEN). The second registry is a
# BEST-EFFORT mirror: it flaps with 502s, so it can never fail the publish — but
# a server that can't reach ghcr.io deploys from it (DEPLOY.md §5), so it is
# kept in step.
#
# `latest` is what the server's deployer ships to production within minutes, so
# only a commit whose CI passed on `main` ever gets it (review 2026-11-28):
#  - CI green on `main`         → `latest` and `sha-<short-sha>` (never before CI passes)
#  - push a tag `v1.2.3`        → `1.2.3`, `1.2`, `1` only — never `latest` (a tag skips CI;
#                                 pin it on a server with DEPLOY_TAG=1.2.3)
#  - manual run on `main`       → `latest` and `sha-<short-sha>`, only when CI passed on that
#                                 exact commit (checked first; the run fails otherwise)
#  - manual run on another ref  → `sha-<short-sha>` only, for a test server to pin
#
# The mirror's host comes from the repository variable MIRROR_REGISTRY (e.g.
# registry.example.com); while it is unset the mirror steps are skipped. Optional
# IMAGE_NAME overrides the mirror image path (default MIRROR_REGISTRY/
# accounting-assistant-api). MIRROR_ENABLED = "false" turns the mirror off.

on:
  # Publish the main image ONLY after the CI workflow has passed on that commit
  # (security review 2026-09-24, H5: untested images used to reach production
  # within two minutes of a push).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # Primary: GitHub Container Registry.
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/accounting-assistant-api
  # Best-effort mirror: its host is a repository variable, so this public file
  # names no server. Empty → the mirror steps are skipped.
  MIRROR_REGISTRY: ${{ vars.MIRROR_REGISTRY }}
  MIRROR_IMAGE: ${{ vars.IMAGE_NAME || format('{0}/accounting-assistant-api', vars.MIRROR_REGISTRY) }}

jobs:
  build-push:
    name: Build & push API image
    # A CI run that failed or was cancelled never publishes. `branches: [main]`
    # above matches the head branch's NAME only, so a pull request from a fork's
    # own `main` passes it too: publish only for a push to this repository
    # (review 2026-11-16; a fork's code would otherwise ship as :latest and the
    # server's deployer would run it).
    if: >-
      ${{ github.event_name != 'workflow_run' || (
            github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.event == 'push'
            && github.event.workflow_run.head_branch == 'main'
            && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write        # push to ghcr.io for this repo's owner
      actions: read          # a manual run on main looks up that commit's CI run
    steps:
      # A manual run used to publish `latest` from any branch with no CI at all,
      # and the deployer put it on production within minutes. From main it now
      # needs a green CI run of that exact commit (a push to main, in this
      # repository); from any other ref it publishes only sha-<short> (below).
      - name: A manual run on main needs a green CI run of that commit
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          green=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&status=success&per_page=1" \
                    --jq '.total_count')
          if [ "${green:-0}" -lt 1 ]; then
            echo "::error::CI has not passed on $SHA (a push to main). Wait for CI, or re-run it; nothing was published."
            exit 1
          fi
          echo "CI passed on $SHA — publishing it as latest."

      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Short SHA of the tested commit
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Log in to the legacy mirror (pushes need its credentials). Best-effort,
      # like the mirror push: the mirror answered 502 at login on 2026-10-19 and
      # failed the whole job before the required GHCR push — production, which
      # pulls from GHCR, got nothing.
      - name: Log in to the mirror registry (if credentials are set)
        if: ${{ vars.MIRROR_ENABLED != 'false' && vars.MIRROR_REGISTRY != '' }}
        continue-on-error: true
        env:
          REG_USER: ${{ secrets.REGISTRY_USERNAME }}
          REG_PASS: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -n "$REG_USER" ]; then
            echo "$REG_PASS" | docker login "$MIRROR_REGISTRY" -u "$REG_USER" --password-stdin \
              || echo "::warning::mirror login to $MIRROR_REGISTRY failed — the mirror push will be skipped"
          else
            echo "No REGISTRY_USERNAME configured — mirror push is anonymous."
          fi

      - name: Derive image tags & labels (ghcr)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          # The action adds `latest` to a semver tag push on its own (latest=auto);
          # off, so only the rule below decides it.
          flavor: |
            latest=false
          tags: |
            # latest: a green CI run of main, or a manual run on main (CI checked above)
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
            type=raw,value=sha-${{ steps.sha.outputs.short }},enable=${{ github.event_name != 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=accounting-assistant-api
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Expose the GitHub Actions cache backend to a raw `docker buildx build`.
      - name: Expose Actions cache to buildx
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Required push → GHCR. Retry a few times for transient registry 5xx; the
      # GHA layer cache makes retries fast.
      - name: Build & push to GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -u
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(--tag "$t"); done <<< "$TAGS"
          while IFS= read -r l; do [ -n "$l" ] && args+=(--label "$l"); done <<< "$LABELS"
          # ignore-error=true → a GitHub Actions *cache* outage (it 400s
          # independently of the registry) doesn't fail the push.
          for attempt in 1 2 3; do
            echo "::group::GHCR push attempt $attempt / 3"
            if docker buildx build --push "${args[@]}" \
                 --cache-from type=gha \
                 --cache-to type=gha,mode=max,ignore-error=true . ; then
              echo "::endgroup::"; echo "✓ pushed to GHCR on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "✗ attempt $attempt failed; retrying in 20s…"; sleep 20
          done
          echo "::error::GHCR push failed after 3 attempts"; exit 1

      # Best-effort mirror to the legacy registry. Copies the manifest+blobs
      # from GHCR (fast, no rebuild). NEVER fails the job — if the mirror is
      # down it's simply skipped, and so is a repository without MIRROR_REGISTRY.
      - name: Mirror to legacy registry (best-effort)
        if: ${{ vars.MIRROR_ENABLED != 'false' && vars.MIRROR_REGISTRY != '' }}
        continue-on-error: true
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -u
          src=""
          createargs=()
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            [ -z "$src" ] && src="$t"
            mt="${t/${GHCR_IMAGE}/${MIRROR_IMAGE}}"
            createargs+=(--tag "$mt")
          done <<< "$TAGS"
          if [ -n "$src" ]; then
            for attempt in 1 2 3; do
              if docker buildx imagetools create "${createargs[@]}" "$src"; then
                echo "✓ mirrored to $MIRROR_REGISTRY on attempt $attempt"; exit 0
              fi
              echo "mirror attempt $attempt failed; retrying in 20s…"; sleep 20
            done
            echo "::warning::mirror to $MIRROR_REGISTRY skipped (registry unavailable) — the hourly Mirror sync copies it once the mirror is back"
          fi

      - name: Summary
        run: |
          {
            echo "### Published to GHCR"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The server deploys on its own: its `deployer` service (scripts/deploy.sh,
  # DEPLOY.md §5) pulls :latest from GHCR, or from the mirror when GHCR doesn't
  # answer, and rolls the api back if the new image isn't healthy. That is why
  # both registries get every image (and the hourly Mirror sync catches up).
