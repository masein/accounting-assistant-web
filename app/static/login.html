<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounting Assistant - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" media="print" data-async-css>
  <style>
    :root {
      --bg: radial-gradient(circle at 15% 10%, #e8f6f2 0%, #ecf4fb 40%, #e7eef7 100%);
      --card: rgba(255,255,255,0.92);
      --border: #d6e2ee;
      --text: #1b2b45;
      --muted: #4e6480;
      --primary: #0f766e;
      --primary-hover: #0b5f58;
      --danger-bg: #fee2e2;
      --danger: #991b1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Avenir Next', 'Trebuchet MS', 'Segoe UI', sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 1rem;
    }
    .card {
      width: min(420px, 96vw);
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      backdrop-filter: blur(8px);
      padding: 1.4rem;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }
    h1 { margin: 0 0 0.4rem 0; font-size: 1.45rem; color: var(--primary); }
    p { margin: 0 0 1.1rem 0; color: var(--muted); }
    label { display: block; font-weight: 600; margin-bottom: 0.35rem; color: var(--muted); }
    input {
      width: 100%;
      padding: 0.65rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 0.85rem;
    }
    .pw-wrap { position: relative; }
    .pw-wrap > input { padding-inline-end: 2.6rem; }
    .pw-toggle {
      position: absolute; inset-inline-end: 0.5rem; top: 0.65rem;
      width: auto; margin: 0; padding: 0.2rem; border: none; background: transparent;
      cursor: pointer; color: var(--text-muted, #64748b); display: inline-flex; align-items: center;
    }
    .pw-toggle:hover { color: var(--primary); }
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.2);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 0.7rem;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      transition: background 150ms ease;
    }
    button:hover { background: var(--primary-hover); }
    .error {
      margin-top: 0.8rem;
      padding: 0.65rem 0.8rem;
      border-radius: 10px;
      border: 1px solid #fca5a5;
      background: var(--danger-bg);
      color: var(--danger);
      display: none;
    }
    .hint { font-size: 0.84rem; color: var(--muted); margin-top: 0.85rem; }
    button.link-btn { width: auto; background: none; color: var(--primary); font-weight: 600; font-size: 0.88rem; padding: 0.35rem 0; margin-top: 0.6rem; }
    button.link-btn:hover { background: none; text-decoration: underline; }
    .tfa-links { display: flex; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; }
    #tfa-code { letter-spacing: 0.25em; text-align: center; font-size: 1.15rem; }
    .lang-row { margin-bottom: 0.75rem; }
    .lang-row label { margin: 0 0 0.35rem 0; min-width: 74px; }
    .lang-pills {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.4rem;
    }
    .lang-pill {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.45rem 0.35rem;
      background: #fff;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      cursor: pointer;
      transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }
    .lang-pill:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(15,23,42,0.08); }
    .lang-pill.active { border-color: var(--primary); background: #e6fffb; color: #0b5f58; }
    .lang-pill .flag { font-size: 1rem; line-height: 1; }
    html[lang="fa"] body,
    html[lang="fa"] input,
    html[lang="fa"] button,
    html[lang="fa"] .lang-pill {
      font-family: 'Vazirmatn', 'Tahoma', 'Segoe UI', sans-serif;
    }
    html[lang="ar"] body,
    html[lang="ar"] input,
    html[lang="ar"] button,
    html[lang="ar"] .lang-pill {
      font-family: 'Tajawal', 'Noto Naskh Arabic', 'Tahoma', sans-serif;
    }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <h1 id="login-title">Accounting Assistant</h1>
    <p id="login-subtitle">Sign in to access transactions, reports, and settings.</p>

    <div class="lang-row">
      <label id="login-language-label">Language</label>
      <div class="lang-pills" id="lang-pills">
        <button type="button" class="lang-pill" data-lang="en"><span class="flag">🇺🇸</span><span>EN</span></button>
        <button type="button" class="lang-pill" data-lang="fa"><span class="flag">🇮🇷</span><span>FA</span></button>
        <button type="button" class="lang-pill" data-lang="es"><span class="flag">🇪🇸</span><span>ES</span></button>
        <button type="button" class="lang-pill" data-lang="ar"><span class="flag">🇸🇦</span><span>AR</span></button>
      </div>
    </div>

    <label for="username" id="username-label">Username</label>
    <input id="username" name="username" autocomplete="username" required>

    <label for="password" id="password-label">Password</label>
    <div class="pw-wrap">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Show password" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button type="submit" id="submit-btn">Login</button>
    <div class="error" id="error-box"></div>
  </form>

  <form class="card" id="tfa-form" style="display:none;" novalidate>
    <h1 id="tfa-title">Two-factor sign-in</h1>
    <p class="sub" id="tfa-sub">Enter the six-digit code from your authenticator app.</p>
    <label for="tfa-code" id="tfa-code-label">Code</label>
    <input id="tfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="16" dir="ltr" autocapitalize="off" spellcheck="false">
    <button type="submit" id="tfa-btn">Verify</button>
    <div class="tfa-links">
      <button type="button" class="link-btn" id="tfa-recovery-toggle">Use a recovery code</button>
      <button type="button" class="link-btn" id="tfa-back">Back</button>
    </div>
    <div class="error" id="tfa-error"></div>
  </form>

  <form class="card" id="change-form" style="display:none;">
    <h1 id="change-title">Set a new password</h1>
    <p class="sub" id="change-sub">You signed in with the default password. Choose a new one to continue.</p>
    <label for="current-password" id="current-password-label">Current password</label>
    <input id="current-password" type="password" autocomplete="current-password">
    <label for="new-password" id="new-password-label">New password</label>
    <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm-password" id="confirm-password-label">Confirm password</label>
    <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit" id="change-btn">Save password</button>
    <div class="error" id="change-error"></div>
  </form>

  <script src="/static/login.js"></script>
</body>
</html>
