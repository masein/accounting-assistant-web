# Production stack — runs the pre-built image CI published instead of building
# locally, and (unlike docker-compose.yml) does NOT bind-mount the source tree,
# so the container runs exactly what CI published.
#
#   sh scripts/deploy.sh                              # the first image, from ghcr.io or the mirror
#   docker compose -f docker-compose.prod.yml up -d   # db, api, deployer, backup
#
# The `deployer` service then keeps the api on the newest image from whichever
# registry answers (DEPLOY.md §5).
#
# Configure via a .env file next to this one (see .env.prod.example). On start
# the API builds the schema and applies migrations automatically (its lifespan
# runs create_all → alembic stamp/upgrade → seed), so a fresh DB boots ready.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  api:
    # A local tag the deployer sets (scripts/deploy.sh): the newest image from
    # ghcr.io, or from the docker.netixsystem.com mirror when ghcr.io doesn't
    # answer. Compose never pulls it — the deployer does. Pin a release with
    # DEPLOY_TAG=1.2.3 in .env (DEPLOY.md §4).
    image: accounting-assistant-api:deployed
    pull_policy: never
    restart: unless-stopped
    logging: *log
    # Behind a TLS-terminating proxy the app must read X-Forwarded-* to know
    # the real scheme/client IP. FORWARDED_ALLOW_IPS lists the proxy address(es)
    # allowed to set those headers (default: same host only).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "${FORWARDED_ALLOW_IPS:-127.0.0.1}"]
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/accounting
      # Optional restricted role for the web server (DEPLOY.md §11): set a
      # password and pre-start creates APP_DB_USER, which cannot alter the
      # schema or change the audit log. Empty = run as DB_USER, as before.
      APP_DB_USER: ${APP_DB_USER:-aa_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      APP_ENV: ${APP_ENV:-prod}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8000}
      # Session-signing secret — REQUIRED in prod (auth tokens are signed with
      # it). Generate one: `openssl rand -hex 32`.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Background jobs (recurring postings, feed refresh, daily digest).
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # Only when the proxy is NOT declared via FORWARDED_ALLOW_IPS.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SCHEDULER_DIGEST_HOUR: ${SCHEDULER_DIGEST_HOUR:-8}
      # uvicorn worker processes (read by uvicorn itself). Shared state is in
      # Postgres and the scheduler runs in one worker at a time, so 2–4 is safe;
      # see DEPLOY.md "More than one worker".
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # Observability (DEPLOY.md §10): JSON logs, optional Sentry/GlitchTip,
      # token-gated Prometheus metrics aggregated across workers.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      # The site is served over HTTPS: the session cookie always carries Secure.
      # Set AUTH_COOKIE_SECURE=false only for a plain-HTTP test box.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # AI provider (defaults to Metis; needs METIS_API_KEY).
      AI_PROVIDER: ${AI_PROVIDER:-metis}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_KEY_HEADER: ${AI_API_KEY_HEADER:-Authorization}
      AI_API_KEY_PREFIX: ${AI_API_KEY_PREFIX:-Bearer}
      METIS_BASE_URL: ${METIS_BASE_URL:-https://api.metisai.ir/openai/v1}
      METIS_MODEL: ${METIS_MODEL:-gpt-4.1-mini}
      OCR_MODEL: ${OCR_MODEL:-gemini-3.7-flash}
      OCR_GEMINI_FALLBACK_MODEL: ${OCR_GEMINI_FALLBACK_MODEL:-gemini-2.5-pro}
      OCR_FALLBACK_MODEL: ${OCR_FALLBACK_MODEL:-gpt-4o}
      METIS_API_KEY: ${METIS_API_KEY:-}
      # Anthropic (Claude) — optional; used when the anthropic provider is picked.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # --- Outgoing mail (verification, alerts). Mail is disabled while
      # SMTP_HOST is empty, so leaving these unset is safe.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-20}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Accounting Assistant}
      SMTP_TO: ${SMTP_TO:-}
      # Absolute base URL used in emailed links — a relative link is useless
      # in an inbox, so this must be the address users actually browse to.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      # Public account creation (personal tenants only). Off unless set.
      ALLOW_SELF_SIGNUP: ${ALLOW_SELF_SIGNUP:-false}
    ports:
      # API_BIND=127.0.0.1 when a reverse proxy runs on the same host, so the
      # unencrypted port is not reachable from the internet.
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    volumes:
      # Persist uploaded branding logos/stamps across image redeploys.
      - uploads:/app/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Cold boot = DB wait + migrations + seed + WeasyPrint/font import (done in
      # the entrypoint pre-start before uvicorn serves). 60s keeps a normal slow
      # first boot from being flagged unhealthy; failures inside this window
      # don't count.
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Zero-touch deploy from two registries (DEPLOY.md §5): every DEPLOY_INTERVAL
  # seconds scripts/deploy.sh pulls :latest from the first registry in
  # DEPLOY_REGISTRIES that answers — ghcr.io, then the docker.netixsystem.com
  # mirror — and, when it's new, recreates the api on it, waits for its health
  # check and puts the previous image back if it doesn't pass. Only the api is
  # touched, never the DB. No inbound access needed: the server pulls. Both
  # registries allow anonymous pulls. The stack's folder is mounted at the same
  # path as on the host (DEPLOY_DIR), so compose in here is the same project.
  deployer:
    image: docker:27.5.1-cli   # pinned: this container holds the Docker socket
    restart: unless-stopped
    logging: *log
    working_dir: ${DEPLOY_DIR:-/opt/accounting}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${DEPLOY_DIR:-/opt/accounting}
    environment:
      DEPLOY_REGISTRIES: ${DEPLOY_REGISTRIES-ghcr.io/masein/accounting-assistant-api docker.netixsystem.com/accounting-assistant-api}
      DEPLOY_TAG: ${DEPLOY_TAG:-latest}
      DEPLOY_INTERVAL: ${DEPLOY_INTERVAL:-120}          # seconds between checks
      DEPLOY_HEALTH_TIMEOUT: ${DEPLOY_HEALTH_TIMEOUT:-300}
      DEPLOY_RETRY_AFTER: ${DEPLOY_RETRY_AFTER:-1800}   # a registry that failed is left alone this long
    entrypoint: ["sh", "scripts/deploy.sh"]
    command: ["loop"]               # `docker compose run --rm deployer once` for one check now
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Daily backups (security review 2026-09-24, H5: there were none). Every day at
  # BACKUP_HOUR (server time) it writes a pg_dump custom-format archive and a tar
  # of the uploads volume into BACKUP_DIR on the host, then prunes copies older
  # than BACKUP_KEEP_DAYS. Copy that folder off the box (rclone / scp / an S3
  # bucket) — a backup on the same disk is not a backup. Run one now with
  # `scripts/backup.sh`; restore with `scripts/restore.sh`.
  backup:
    image: postgres:16
    restart: unless-stopped
    logging: *log
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATABASE: accounting
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads:ro
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  uploads:
