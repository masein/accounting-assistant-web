# Production stack — pulls the pre-built image from the registry instead of
# building locally, and (unlike docker-compose.yml) does NOT bind-mount the
# source tree, so the container runs exactly what CI published.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Configure via a .env file next to this one (see .env.prod.example). On start
# the API builds the schema and applies migrations automatically (its lifespan
# runs create_all → alembic stamp/upgrade → seed), so a fresh DB boots ready.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  api:
    # Pulls from GitHub Container Registry (what CI publishes to). Override the
    # exact tag with API_IMAGE in .env (e.g. pin :1.2.3 for a reproducible
    # deploy; defaults to :latest). The old docker.netixsystem.com registry is
    # only a best-effort mirror now — don't point deploys at it.
    image: ${API_IMAGE:-ghcr.io/masein/accounting-assistant-api:latest}
    pull_policy: always
    restart: unless-stopped
    logging: *log
    # Behind a TLS-terminating proxy the app must read X-Forwarded-* to know
    # the real scheme/client IP. FORWARDED_ALLOW_IPS lists the proxy address(es)
    # allowed to set those headers (default: same host only).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "${FORWARDED_ALLOW_IPS:-127.0.0.1}"]
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/accounting
      APP_ENV: ${APP_ENV:-prod}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8000}
      # Session-signing secret — REQUIRED in prod (auth tokens are signed with
      # it). Generate one: `openssl rand -hex 32`.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Background jobs (recurring postings, feed refresh, daily digest).
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      # Only when the proxy is NOT declared via FORWARDED_ALLOW_IPS.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SCHEDULER_DIGEST_HOUR: ${SCHEDULER_DIGEST_HOUR:-8}
      # uvicorn worker processes (read by uvicorn itself). Shared state is in
      # Postgres and the scheduler runs in one worker at a time, so 2–4 is safe;
      # see DEPLOY.md "More than one worker".
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # The site is served over HTTPS: the session cookie always carries Secure.
      # Set AUTH_COOKIE_SECURE=false only for a plain-HTTP test box.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # AI provider (defaults to Metis; needs METIS_API_KEY).
      AI_PROVIDER: ${AI_PROVIDER:-metis}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_KEY_HEADER: ${AI_API_KEY_HEADER:-Authorization}
      AI_API_KEY_PREFIX: ${AI_API_KEY_PREFIX:-Bearer}
      METIS_BASE_URL: ${METIS_BASE_URL:-https://api.metisai.ir/openai/v1}
      METIS_MODEL: ${METIS_MODEL:-gpt-4.1-mini}
      OCR_MODEL: ${OCR_MODEL:-gemini-3.7-flash}
      OCR_GEMINI_FALLBACK_MODEL: ${OCR_GEMINI_FALLBACK_MODEL:-gemini-2.5-pro}
      OCR_FALLBACK_MODEL: ${OCR_FALLBACK_MODEL:-gpt-4o}
      METIS_API_KEY: ${METIS_API_KEY:-}
      # Anthropic (Claude) — optional; used when the anthropic provider is picked.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # --- Outgoing mail (verification, alerts). Mail is disabled while
      # SMTP_HOST is empty, so leaving these unset is safe.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-20}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Accounting Assistant}
      SMTP_TO: ${SMTP_TO:-}
      # Absolute base URL used in emailed links — a relative link is useless
      # in an inbox, so this must be the address users actually browse to.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      # Public account creation (personal tenants only). Off unless set.
      ALLOW_SELF_SIGNUP: ${ALLOW_SELF_SIGNUP:-false}
    ports:
      # API_BIND=127.0.0.1 when a reverse proxy runs on the same host, so the
      # unencrypted port is not reachable from the internet.
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    labels:
      # Only this container is auto-updated by Watchtower (never the DB).
      com.centurylinklabs.watchtower.enable: "true"
    volumes:
      # Persist uploaded branding logos/stamps across image redeploys.
      - uploads:/app/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Cold boot = DB wait + migrations + seed + WeasyPrint/font import (done in
      # the entrypoint pre-start before uvicorn serves). 60s keeps a normal slow
      # first boot from being flagged unhealthy; failures inside this window
      # don't count.
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Zero-touch deploy: polls the registry and auto-recreates the api container
  # when CI publishes a new image. LABEL_ENABLE means it only touches containers
  # labelled com.centurylinklabs.watchtower.enable=true (the api) — never the DB.
  # No inbound access from GitHub needed; the server pulls. The registry allows
  # anonymous pulls, so no registry credentials are configured here.
  watchtower:
    image: containrrr/watchtower:1.7.1   # pinned: this container holds the Docker socket
    restart: unless-stopped
    logging: *log
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"            # remove the old image after updating
      WATCHTOWER_LABEL_ENABLE: "true"       # only update labelled containers
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-120}  # seconds
      WATCHTOWER_TIMEOUT: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Daily backups (security review 2026-09-24, H5: there were none). Every day at
  # BACKUP_HOUR (server time) it writes a pg_dump custom-format archive and a tar
  # of the uploads volume into BACKUP_DIR on the host, then prunes copies older
  # than BACKUP_KEEP_DAYS. Copy that folder off the box (rclone / scp / an S3
  # bucket) — a backup on the same disk is not a backup. Run one now with
  # `scripts/backup.sh`; restore with `scripts/restore.sh`.
  backup:
    image: postgres:16
    restart: unless-stopped
    logging: *log
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATABASE: accounting
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads:ro
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
  uploads:
