services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: accounting
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # Uncomment below for local psql access during development:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  api:
    build:
      context: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/accounting
      APP_ENV: ${APP_ENV:-dev}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:8000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-lmstudio}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_KEY_HEADER: ${AI_API_KEY_HEADER:-Authorization}
      AI_API_KEY_PREFIX: ${AI_API_KEY_PREFIX:-Bearer}
      METIS_BASE_URL: ${METIS_BASE_URL:-https://api.metisai.ir/openai/v1}
      METIS_MODEL: ${METIS_MODEL:-gpt-4o-mini}
      METIS_API_KEY: ${METIS_API_KEY:-}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-qwen/qwen3-4b-thinking-2507}
      # --- Outgoing mail (verification, alerts). Mail is disabled while
      # SMTP_HOST is empty, so leaving these unset is safe.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-20}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Accounting Assistant}
      SMTP_TO: ${SMTP_TO:-}
      # Absolute base URL used in emailed links — a relative link is useless
      # in an inbox, so this must be the address users actually browse to.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      # Public account creation (personal tenants only). Off unless set.
      ALLOW_SELF_SIGNUP: ${ALLOW_SELF_SIGNUP:-false}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Cold boot = DB wait + migrations + seed + WeasyPrint/font import (done in
      # the entrypoint pre-start before uvicorn serves). 60s keeps a normal slow
      # first boot from being flagged unhealthy; failures inside this window
      # don't count.
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

volumes:
  pgdata:
